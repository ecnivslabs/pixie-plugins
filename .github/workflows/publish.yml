name: Publish signed index

on:
  push:
    branches: [master]
    paths:
      - 'index/**'
      - 'meta/**'
      - 'owners/**'
      - blocklist.json
      - official-owners.json
  schedule:
    # Re-sign daily so the index never reaches its expiry while the registry is idle.
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: registry-signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require the public signing key
        run: test -f registry-signing.public.pem

      - name: Build index
        run: python3 .github/scripts/build_index.py . _site/index.json

      - name: Sign and verify index
        env:
          REGISTRY_SIGNING_KEY: ${{ secrets.REGISTRY_SIGNING_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/registry-signing.pem"
          signature="$RUNNER_TEMP/index.sig"
          printf '%s\n' "$REGISTRY_SIGNING_KEY" > "$key"
          openssl pkeyutl -sign -inkey "$key" -rawin -in _site/index.json -out "$signature"
          rm -f "$key"
          openssl pkeyutl -verify -pubin -inkey registry-signing.public.pem -rawin \
            -in _site/index.json -sigfile "$signature"
          base64 -w0 "$signature" > _site/index.json.sig

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
